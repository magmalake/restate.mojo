name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  # macOS runs here, nightly and by hand (Actions > CI > Run workflow), not on
  # PRs or main: GitHub's hosted macOS pool is short on capacity, and a job
  # that never gets a runner fails the required `ci` gate.
  schedule:
    - cron: '60 7 * * *'

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # The test legs below are skipped on release PRs, and the consumer build
      # is the check (the tests need the Rust toolchain and Node, which the shared job does not set up).
      task: ""

  test:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["macos-latest", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      # The shim is a Rust cdylib built by pixi as a source dependency.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi

      # Both gates boot a real restate-server through npx.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0

      - name: Compile the examples
        run: pixi run build-example

      # Ports are overridable so a developer's own restate-server is never
      # touched; CI has the machine to itself but sets them anyway.
      - name: Integration gate
        env:
          RESTATE_IT_INGRESS: 18080
          RESTATE_IT_ADMIN: 19070
          RESTATE_IT_NODE: 15122
          RESTATE_IT_ENDPOINT: 19080
        run: pixi run it

      - name: Served gate (concurrency, and the self-call that used to deadlock)
        env:
          RESTATE_IT_INGRESS: 28080
          RESTATE_IT_ADMIN: 29070
          RESTATE_IT_NODE: 25122
          RESTATE_IT_ENDPOINT: 29080
        run: pixi run it-served

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [release, release-check, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
