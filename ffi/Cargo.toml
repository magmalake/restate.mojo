[package]
name = "restatemojo"
version = "0.2.0"
edition = "2021"
description = "C-ABI shim over the restate-sdk crate, for the restate.mojo Mojo binding."

[lib]
name = "restatemojo"
crate-type = ["cdylib"]

[dependencies]
restate-sdk = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures = "0.3"
